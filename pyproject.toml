[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-optimization-lab"
version = "0.1.0"
description = "Mean-variance and risk-parity portfolio optimization with CVXPY, plus a fixed-iteration ADMM reference kernel for hardware-acceleration research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tyler Tik Man Cheng" }]
dependencies = ["numpy>=1.24", "cvxpy>=1.4"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "pillow>=9"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
